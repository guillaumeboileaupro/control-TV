[package]
name = "control-tv"
version = "0.1.0"
description = "Lightweight Chromecast / Google TV controller - Tauri application shell"
authors = ["control-TV contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "control_tv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `time` is for `tokio::time::timeout`, bounding how long a bridge call is allowed to run;
# spawning the blocking bridge call itself uses tauri::async_runtime (already backed by
# tokio). `rt` is only for a test that builds a single-threaded runtime to prove a blocking
# bridge call never runs on the async thread. Both are feature-unified with tauri's own tokio.
tokio = { version = "1", features = ["time", "rt"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
