<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>control-TV</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!--
      A remote, not a dashboard: the current device and what it is doing first, then the TV's
      own remote, its apps and the Cast sound, each grouped on its own surface.
      Nothing here talks to Chromecast directly; src/main.ts draws these regions from the
      state rules in src/model.ts and reaches the devices only through the application's
      commands. Icons are one consistent SVG set (24px grid, 1.75 stroke), referenced by id.
    -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-tv" viewBox="0 0 24 24">
          <rect x="3" y="4.5" width="18" height="12" rx="2" />
          <path d="M8 20h8M12 16.5V20" />
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M16 16l4.5 4.5" />
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
          <path d="M19 12a7 7 0 1 1-2.05-4.95" />
          <path d="M19 5v4h-4" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="M5 12.5l4.5 4.5L19 7.5" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24">
          <path d="M6 9l6 6 6-6" />
        </symbol>
        <symbol id="i-play" viewBox="0 0 24 24">
          <path d="M8 5.5v13l10-6.5z" />
        </symbol>
        <symbol id="i-pause" viewBox="0 0 24 24">
          <rect x="7" y="5.5" width="3.5" height="13" rx="1" />
          <rect x="13.5" y="5.5" width="3.5" height="13" rx="1" />
        </symbol>
        <symbol id="i-buffering" viewBox="0 0 24 24">
          <path d="M12 4.5a7.5 7.5 0 1 0 7.5 7.5" />
        </symbol>
        <symbol id="i-stop" viewBox="0 0 24 24">
          <rect x="6.5" y="6.5" width="11" height="11" rx="1.5" />
        </symbol>
        <symbol id="i-idle" viewBox="0 0 24 24">
          <rect x="6.5" y="6.5" width="11" height="11" rx="1.5" />
        </symbol>
        <symbol id="i-undetermined" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" />
          <path d="M12 16.5h.01M9.8 9.6a2.4 2.4 0 1 1 3.4 2.2c-.7.4-1.2.9-1.2 1.7" />
        </symbol>
        <symbol id="i-volume" viewBox="0 0 24 24">
          <path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z" />
          <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" />
        </symbol>
        <symbol id="i-volume-off" viewBox="0 0 24 24">
          <path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z" />
          <path d="M16 9.5l5 5M21 9.5l-5 5" />
        </symbol>
        <symbol id="i-app" viewBox="0 0 24 24">
          <rect x="4.5" y="4.5" width="6" height="6" rx="1.5" />
          <rect x="13.5" y="4.5" width="6" height="6" rx="1.5" />
          <rect x="4.5" y="13.5" width="6" height="6" rx="1.5" />
          <rect x="13.5" y="13.5" width="6" height="6" rx="1.5" />
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7.5v5.5M12 16.5h.01" />
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5.5M12 7.5h.01" />
        </symbol>
        <symbol id="i-power" viewBox="0 0 24 24">
          <path d="M12 3.5v8" />
          <path d="M7.2 6.6a7 7 0 1 0 9.6 0" />
        </symbol>
        <symbol id="i-up" viewBox="0 0 24 24">
          <path d="M6 15l6-6 6 6" />
        </symbol>
        <symbol id="i-down" viewBox="0 0 24 24">
          <path d="M6 9l6 6 6-6" />
        </symbol>
        <symbol id="i-left" viewBox="0 0 24 24">
          <path d="M15 6l-6 6 6 6" />
        </symbol>
        <symbol id="i-right" viewBox="0 0 24 24">
          <path d="M9 6l6 6-6 6" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="M9 7L4.5 11.5 9 16" />
          <path d="M5 11.5h9.5a5 5 0 0 1 0 10H12" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24">
          <path d="M4.5 10.5L12 4l7.5 6.5V19a1 1 0 0 1-1 1h-4v-5.5h-5V20h-4a1 1 0 0 1-1-1z" />
        </symbol>
        <symbol id="i-minus" viewBox="0 0 24 24">
          <path d="M6 12h12" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 6v12M6 12h12" />
        </symbol>
        <symbol id="i-keyboard" viewBox="0 0 24 24">
          <rect x="3" y="6" width="18" height="12" rx="2" />
          <path d="M7 10h.01M10.5 10h.01M14 10h.01M17.5 10h.01M8 14h8" />
        </symbol>
        <symbol id="i-backspace" viewBox="0 0 24 24">
          <path d="M9 5.5h10.5a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H9L3 12z" />
          <path d="M12 9.5l5 5M17 9.5l-5 5" />
        </symbol>
        <symbol id="i-enter" viewBox="0 0 24 24">
          <path d="M19.5 5v6.5a2 2 0 0 1-2 2H5" />
          <path d="M9 9.5L5 13.5l4 4" />
        </symbol>
        <symbol id="i-send" viewBox="0 0 24 24">
          <path d="M4.5 12L20 4.5 16.5 20l-4-6.5z" />
          <path d="M12.5 13.5L20 4.5" />
        </symbol>
      </defs>
    </svg>

    <div class="app">
      <header class="appbar">
        <img class="logo" src="/logo.svg" alt="" width="32" height="27" />
        <h1 class="wordmark">control-TV</h1>
      </header>

      <div id="service-notice" class="notice" role="alert" hidden></div>

      <main class="main">
        <details id="picker" class="picker" open>
          <summary id="picker-summary" class="picker-summary"></summary>
          <div class="picker-body">
            <button id="discover-button" class="btn btn-primary" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
              <span id="discover-label">Find devices</span>
            </button>
            <div id="devices-message" class="message" aria-live="polite"></div>
            <ul id="devices-list" class="devices"></ul>
          </div>
        </details>

        <section id="context" class="context" aria-label="Current device state" hidden>
          <!-- What the TV is doing, and the Cast playback controls for it. -->
          <div class="card now-card">
            <div class="context-head">
              <p id="observed" class="meta"></p>
              <button
                id="refresh-button"
                class="btn-icon"
                type="button"
                aria-label="Refresh status"
                title="Refresh status"
              >
                <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg>
              </button>
            </div>
            <div id="context-now" aria-live="polite"></div>

            <!-- Playback controls: static elements updated in place, so keyboard focus is never
                 lost when the state changes. Shown only for media the TV reports on a
                 connected device; what each offers comes from the observed state. -->
            <div id="controls" class="controls" role="group" aria-label="Playback controls" hidden>
              <div id="seek" class="seek" hidden>
                <input
                  id="seek-input"
                  class="range"
                  type="range"
                  min="0"
                  max="0"
                  step="1"
                  value="0"
                  aria-label="Seek position"
                />
                <p id="seek-label" class="seek-label is-empty"></p>
              </div>
              <div class="transport">
                <button id="primary-button" class="btn btn-primary btn-transport" type="button">
                  <svg class="icon" aria-hidden="true"><use href="#i-pause" /></svg>
                  <span id="primary-label">Pause</span>
                </button>
                <button id="stop-button" class="btn btn-transport-secondary" type="button">
                  <svg class="icon" aria-hidden="true"><use href="#i-stop" /></svg>
                  <span id="stop-label">Stop</span>
                </button>
              </div>
              <p id="controls-note" class="note" hidden></p>
              <p id="pause-note" class="note" hidden></p>
              <p id="seek-note" class="note" hidden></p>
            </div>

            <!-- Outside the controls on purpose: a command's outcome must stay visible even when
                 its result removes the controls (a stopped TV has no media left to control). -->
            <div id="command-feedback" class="command-feedback" aria-live="polite"></div>

            <div id="context-facts"></div>
          </div>

          <!-- The TV's own remote (Google TV remote protocol): the volume the TV itself sets, mute,
               power and navigation, then the TV's apps and its keyboard. Each press sends one key
               once; what is shown of the TV is its own last report. -->
          <div id="tv-remote" class="tv-remote" role="group" aria-label="TV remote and apps" hidden>
            <!-- The remote's own keys: only for a TV that advertises its remote channel. -->
            <div id="remote-keys" class="card remote-card">
              <div class="card-head">
                <h2 id="tv-remote-title" class="card-title">TV remote</h2>
                <div class="card-head-actions">
                  <button
                    id="remote-read"
                    class="btn-icon"
                    type="button"
                    aria-label="Read TV state"
                    title="Read TV state"
                  >
                    <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg>
                  </button>
                  <button
                    class="btn-round btn-power"
                    type="button"
                    data-remote-key="power"
                    aria-label="TV power"
                    title="TV power"
                  >
                    <svg class="icon" aria-hidden="true"><use href="#i-power" /></svg>
                  </button>
                </div>
              </div>
              <p id="remote-readout" class="readout is-empty"></p>

              <div id="remote-pairing" class="pairing" hidden>
                <p id="remote-pairing-text" class="pairing-text"></p>
                <div class="pairing-row">
                  <input
                    id="remote-code"
                    class="field remote-code"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    maxlength="6"
                    aria-label="Code shown on the TV"
                    hidden
                  />
                  <button id="remote-pair" class="btn btn-primary" type="button" hidden>
                    Pair
                  </button>
                  <button id="remote-show-code" class="btn" type="button">Show code on TV</button>
                </div>
              </div>

              <div class="pad-area">
                <div class="dpad" role="group" aria-label="Navigation">
                  <button
                    class="dpad-key dpad-up"
                    type="button"
                    data-remote-key="up"
                    aria-label="Up"
                  >
                    <svg class="icon" aria-hidden="true"><use href="#i-up" /></svg>
                  </button>
                  <button
                    class="dpad-key dpad-left"
                    type="button"
                    data-remote-key="left"
                    aria-label="Left"
                  >
                    <svg class="icon" aria-hidden="true"><use href="#i-left" /></svg>
                  </button>
                  <button class="dpad-ok" type="button" data-remote-key="ok">OK</button>
                  <button
                    class="dpad-key dpad-right"
                    type="button"
                    data-remote-key="right"
                    aria-label="Right"
                  >
                    <svg class="icon" aria-hidden="true"><use href="#i-right" /></svg>
                  </button>
                  <button
                    class="dpad-key dpad-down"
                    type="button"
                    data-remote-key="down"
                    aria-label="Down"
                  >
                    <svg class="icon" aria-hidden="true"><use href="#i-down" /></svg>
                  </button>
                </div>
              </div>

              <div class="remote-row">
                <button class="btn-pill" type="button" data-remote-key="back" aria-label="Back">
                  <svg class="icon" aria-hidden="true"><use href="#i-back" /></svg>
                  <span>Back</span>
                </button>
                <button class="btn-pill" type="button" data-remote-key="home" aria-label="Home">
                  <svg class="icon" aria-hidden="true"><use href="#i-home" /></svg>
                  <span>Home</span>
                </button>
              </div>

              <div class="volume-rocker" role="group" aria-label="TV volume">
                <button
                  class="rocker-key"
                  type="button"
                  data-remote-key="volume_down"
                  aria-label="TV volume down"
                  title="TV volume down"
                >
                  <svg class="icon" aria-hidden="true"><use href="#i-minus" /></svg>
                </button>
                <button
                  class="rocker-key rocker-mute"
                  type="button"
                  data-remote-key="mute"
                  aria-label="TV mute or unmute"
                  title="TV mute or unmute"
                >
                  <svg class="icon" aria-hidden="true"><use href="#i-volume-off" /></svg>
                  <span>Mute</span>
                </button>
                <button
                  class="rocker-key"
                  type="button"
                  data-remote-key="volume_up"
                  aria-label="TV volume up"
                  title="TV volume up"
                >
                  <svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg>
                </button>
              </div>

              <!-- The TV's active text field: the text replaces what the field holds; it is
                   sent once and never kept or logged (it may be a password). -->
              <details class="keyboard">
                <summary class="keyboard-summary">
                  <svg class="icon" aria-hidden="true"><use href="#i-keyboard" /></svg>
                  <span>Keyboard</span>
                  <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron" /></svg>
                </summary>
                <p id="remote-text-hint" class="hint">
                  Open a search or text field on the TV first. The text replaces what the field
                  holds.
                </p>
                <form id="remote-text-form" class="keyboard-form">
                  <input
                    id="remote-text"
                    class="field"
                    type="text"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    enterkeyhint="send"
                    placeholder="Text for the TV"
                    aria-label="Text to type in the TV's active field"
                    aria-describedby="remote-text-hint"
                  />
                  <button id="remote-text-send" class="btn btn-primary" type="submit">
                    Send text
                  </button>
                </form>
                <div class="remote-row">
                  <button
                    class="btn-pill"
                    type="button"
                    data-remote-key="delete"
                    aria-label="Backspace on the TV"
                  >
                    <svg class="icon" aria-hidden="true"><use href="#i-backspace" /></svg>
                    <span>Backspace</span>
                  </button>
                  <button
                    class="btn-pill"
                    type="button"
                    data-remote-key="enter"
                    aria-label="Enter on the TV"
                  >
                    <svg class="icon" aria-hidden="true"><use href="#i-enter" /></svg>
                    <span>Enter</span>
                  </button>
                </div>
              </details>
            </div>

            <!-- The TV's installed apps: listed and opened over the TV's debugging (which the
                 owner turns on), a service separate from the remote: shown for every TV. -->
            <div class="card tv-apps" role="group" aria-labelledby="tv-apps-title">
              <div class="card-head">
                <h2 id="tv-apps-title" class="card-title">TV apps</h2>
                <button id="remote-apps-list" class="btn btn-small" type="button">
                  Show TV apps
                </button>
              </div>
              <input
                id="remote-apps-filter"
                class="field"
                type="search"
                autocomplete="off"
                spellcheck="false"
                placeholder="Find an app"
                aria-label="Find an app"
                hidden
              />
              <ul id="remote-apps" class="app-grid" aria-label="Apps installed on the TV"></ul>
            </div>

            <!-- The outcome of the last remote action, kept in view while the remote scrolls. -->
            <div id="remote-feedback" class="remote-feedback" aria-live="polite"></div>
          </div>

          <!-- Cast sound: the receiver's own volume and mute, which on many TVs is not the sound
               you hear (the TV remote above is). Static elements updated in place. -->
          <div id="sound" class="card sound" role="group" aria-label="Cast sound" hidden>
            <h2 class="card-title">Cast sound</h2>
            <div class="sound-row">
              <button
                id="mute-button"
                class="btn btn-mute"
                type="button"
                aria-label="Mute"
                title="Mute"
              >
                <svg class="icon" aria-hidden="true"><use href="#i-volume" /></svg>
              </button>
              <input
                id="volume-input"
                class="range volume-input"
                type="range"
                min="0"
                max="100"
                step="1"
                value="0"
                aria-label="Volume"
              />
            </div>
            <p id="sound-readout" class="readout sound-readout is-empty"></p>
            <p id="sound-note" class="note" hidden></p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
