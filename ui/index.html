<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>control-TV</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!--
      Application shell. Nothing here talks to Chromecast directly - every action goes
      through the Tauri commands defined in src-tauri/src/lib.rs, which forward to the
      shared Python control layer (src/control_tv/bridge.py). Views are drawn by
      src/main.ts from the state rules in src/model.ts. After discovery this UI only reads
      device status; playback and volume/mute controls are later slices.
    -->
    <main class="app">
      <header class="app-header">
        <h1>control-TV</h1>
        <p id="backend-status" class="status" role="status">Checking control backend…</p>
      </header>

      <section class="panel" aria-labelledby="devices-heading">
        <div class="panel-header">
          <h2 id="devices-heading">Devices</h2>
          <button id="discover-button" type="button">Discover devices</button>
        </div>
        <p id="devices-message" class="message" aria-live="polite"></p>
        <ul id="devices-list" class="devices"></ul>
      </section>

      <section class="panel" aria-labelledby="selected-heading">
        <div class="panel-header">
          <h2 id="selected-heading">Selected device</h2>
          <button id="refresh-button" type="button" disabled>Refresh status</button>
        </div>
        <p id="selected-summary" class="message"></p>
        <div id="status-body" aria-live="polite"></div>
      </section>

      <!-- Placeholder for the next slice: playback controls and volume/mute controls.
           Left unbuilt on purpose - no control command is exposed to the UI yet. -->
      <section class="panel panel-placeholder" aria-hidden="true">
        <p>Playback controls and volume/mute controls follow here.</p>
      </section>
    </main>
  </body>
</html>
