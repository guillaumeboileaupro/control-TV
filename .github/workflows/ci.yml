name: CI

# Quoted: unquoted `on:` parses as the boolean `true` under YAML 1.1 (PyYAML and some
# linters), even though GitHub Actions itself accepts either spelling.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, test and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Pinned by commit (see the trailing comment for the tagged version) rather than
      # a moving tag, per the action's own published security guidance.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned: uv decides which CPython patch it installs, and release bridges embed
          # exactly packaging/release-python-version.
          version: "0.12.23"
          enable-cache: true

      # scripts/dev.py is the single source of truth for these commands: local
      # development and CI run exactly the same checks, nothing is redefined here.
      - name: Install the locked, reproducible environment
        run: python3 scripts/dev.py setup

      - name: Lint, type-check, test and verify dependency consistency
        run: python3 scripts/dev.py check

      - name: Enforce test coverage of the shared control/domain layer
        run: python3 scripts/dev.py coverage

      - name: Inspect remaining project-owned generated footprint
        if: always()
        run: python3 scripts/dev.py disk-usage

      - name: Clean disposable build/test output
        if: always()
        run: python3 scripts/dev.py clean

  tauri:
    name: Tauri shell (Rust and frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Tauri 2's Linux runtime/build dependencies (webkit2gtk, appindicator, rsvg);
      # matches what a Debian/Ubuntu desktop needs to build and run this application.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            build-essential

      # @stable is this action's own documented usage, not a moving-tag shortcut: it
      # deliberately resolves to whatever Rust's current stable release is, which is the
      # point of using it instead of a fixed toolchain version.
      - name: Install the Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned: uv decides which CPython patch it installs, and release bridges embed
          # exactly packaging/release-python-version.
          version: "0.12.23"
          enable-cache: true

      # The Python environment is needed too: `cargo test` spawns the real
      # control_tv.bridge process to prove the Rust <-> Python boundary actually works,
      # not just that each side compiles in isolation.
      - name: Install the locked, reproducible Python environment
        run: python3 scripts/dev.py setup

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      - name: Type-check and format-check the frontend
        run: python3 scripts/dev.py ui-check

      - name: Format, lint and test the Tauri shell crate
        run: python3 scripts/dev.py rust-check

      - name: Build the frontend and the Tauri application (debug profile)
        run: npx --prefix ui tauri build --debug --bundles deb

      - name: Inspect remaining project-owned generated footprint
        if: always()
        run: python3 scripts/dev.py disk-usage

      - name: Clean disposable build/test output
        if: always()
        run: python3 scripts/dev.py clean

  linux-release:
    name: Linux release package (frozen bridge and .deb)
    # The oldest supported Ubuntu LTS runner: the frozen bridge copies this system's GCC
    # runtime, so the build host sets the oldest glibc the package can run on.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            build-essential

      - name: Install the Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pinned: uv decides which CPython patch it installs, and release bridges embed
          # exactly packaging/release-python-version.
          version: "0.12.23"
          enable-cache: true

      - name: Install the locked, reproducible Python environment
        run: python3 scripts/dev.py setup

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      # The debug job never compiles the release-only bridge resolution.
      - name: Lint the release build of the Tauri shell crate
        working-directory: src-tauri
        run: cargo clippy --release -- -D warnings

      # Freeze the bridge on the release CPython, smoke it outside the checkout in a namespace
      # where the checkout and the build Python are verified empty (the job fails if that
      # isolation cannot be set up), build the release .deb with remapped build paths, scan
      # the package (fail-closed on the frozen archive), check its content and modes, and
      # write the bridge inventory and dist/SHA256SUMS.
      - name: Build, smoke and package the Linux release
        run: python3 scripts/dev.py release-deb

      # The archive-scanner regressions need PyInstaller, which only this job installs: here
      # they must run, not skip.
      - name: Run the packaging tests with PyInstaller required
        env:
          CONTROL_TV_REQUIRE_PYINSTALLER: "1"
        run: .venv/bin/python -m pytest -q -rs tests/test_packaging_build.py tests/test_release_linux.py

      # Installs the package on this runner and pings the installed bridge directly, with an
      # empty environment from outside the checkout. It does not launch the application.
      - name: Install the package, ping its bridge and remove it
        run: |
          sudo apt-get install --no-install-recommends -y ./dist/control-tv_*_amd64.deb
          cd "$RUNNER_TEMP"
          printf '{"id":1,"method":"ping","params":{}}\n' \
            | env -i PATH=/nonexistent /usr/lib/control-tv/python-bridge/control-tv-bridge \
            | tee ping.json
          grep -q '"status": "ready"' ping.json
          sudo apt-get remove --purge -y control-tv
          test ! -e /usr/lib/control-tv

      - name: Keep the release package, inventory and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-tv-linux-release
          path: |
            dist/control-tv_*_amd64.deb
            dist/python-bridge.inventory.tsv
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

      - name: Inspect remaining project-owned generated footprint
        if: always()
        run: python3 scripts/dev.py disk-usage

      - name: Clean disposable build/test output
        if: always()
        run: python3 scripts/dev.py clean

  android:
    name: Android APK (arm64 debug build and JVM tests)
    # Build-level evidence only: no device, no emulator, nothing installed or launched.
    # Real-phone validation is recorded separately (DEVELOPMENT_PLAN.md, Phase 7b).
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
    steps:
      - name: Check out the repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # The debug Rust library for aarch64 and the Gradle build need several GiB; drop
      # preinstalled toolchains this job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: Install JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # @stable: see the tauri job.
      - name: Install the Rust stable toolchain with the Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true

      # The runner's Android SDK has no fixed NDK; install the one the project builds with.
      - name: Install the Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          clang="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          {
            echo "NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$clang"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$clang"
          } >> "$GITHUB_ENV"

      - name: Install the locked, reproducible Python environment
        run: python3 scripts/dev.py setup

      - name: Install frontend dependencies
        run: npm ci --prefix ui

      - name: Lint the Android build of the Tauri shell crate
        working-directory: src-tauri
        run: cargo clippy --target aarch64-linux-android --lib -- -D warnings

      # android-python (pure wheels hash-checked against uv.lock, built offline with the
      # locked backends), then the debug arm64 APK with the embedded Python.
      - name: Build the arm64 debug APK
        run: python3 scripts/dev.py android-apk

      - name: Run the Android JVM unit tests (Kotlin bridge relay, multicast lock)
        working-directory: src-tauri/gen/android
        run: ./gradlew --console=plain :app:testArm64DebugUnitTest

      - name: Record the APK checksum
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          sha256sum "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
          stat -c '%s bytes' "$apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK (build artifact, not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-tv-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          retention-days: 7
          if-no-files-found: error

      - name: Inspect remaining project-owned generated footprint
        if: always()
        run: python3 scripts/dev.py disk-usage

      - name: Clean disposable build/test output
        if: always()
        run: python3 scripts/dev.py clean
