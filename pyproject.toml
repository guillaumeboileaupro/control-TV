[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-tv"
version = "0.1.0"
description = "Lightweight Chromecast / Google TV controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyChromecast>=14.0.10,<15",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
]
# The frozen Python bridge shipped inside release packages (`dev.py bridge-build`); exact
# pins so a release sidecar is rebuilt with the same freezer and hooks.
packaging = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
]
# Preparing the Python packages the Android app embeds (`dev.py android-python`): pip
# downloads the locked wheels with their hashes, and wheel retags the zeroconf wheel built
# without its optional Cython extensions as pure Python.
android = [
    "pip==25.3",
    "wheel==0.45.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_tv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "packaging"]
mypy_path = "src"

[[tool.mypy.overrides]]
# PyInstaller ships no type information and is installed only by `dev.py bridge-build`.
module = ["PyInstaller", "PyInstaller.*"]
ignore_missing_imports = true

[tool.ruff]
# Python sources only: recent ruff releases also format Markdown and TOML by default.
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "packaging/**/*.py"]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
