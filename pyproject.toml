[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-tv"
version = "0.1.0"
description = "Lightweight Chromecast / Google TV controller"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyChromecast>=14.0.10,<15",
]

[project.optional-dependencies]
# The MCP server (`python -m control_tv.mcp_server`). Optional: the desktop bridge and the
# Android app never install it (see DEVELOPMENT_PLAN.md, Phase 6).
mcp = [
    "mcp==1.30.0",
]
# The Google TV's own remote channel (Android TV Remote protocol v2). The desktop bridge and
# Android app embed this extra. On Ubuntu, the app inventory uses the system Android platform
# tools so their ADB server owns TLS, mDNS and pairing keys; Android cannot host that server.
tvremote = [
    "androidtvremote2==0.3.2",
    # The phone has no adb program: there the TV's app list goes through this pure-Python
    # classic ADB (port 5555) instead (`adapters/tv_apps_adb_shell.py`).
    "adb-shell==0.4.4",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
]
# The frozen Python bridge shipped inside release packages (`dev.py bridge-build`); exact
# pins so a release sidecar is rebuilt with the same freezer and hooks.
packaging = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
]
# Preparing the Python packages the Android app embeds (`dev.py android-python`). The wheels
# are built offline with pip (`--no-build-isolation --no-index`), so their build backends are
# these locked versions, never ones resolved at build time: setuptools (control-tv, and the
# distutils zeroconf's build script imports) and poetry-core (zeroconf). wheel retags the
# zeroconf wheel, built without its optional Cython extensions, as pure Python.
android = [
    "pip==26.2.1",
    "wheel==0.46.3",
    "poetry-core==2.5.0",
    "setuptools==84.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_tv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "packaging"]
mypy_path = "src"

[[tool.mypy.overrides]]
# No explicit Any in the application, scripts or packaging (tests may still use it, owner
# decision of 2026-10-13): external data is narrowed from `object` or typed JSON
# (`control_tv.json_types`), and libraries are reached through Protocols.
module = ["control_tv", "control_tv.*", "android_icon", "android_python", "bridge_entry", "build_bridge", "cast_observe", "dev", "release_linux"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
# PyInstaller ships no type information and is installed only by `dev.py bridge-build`.
module = ["PyInstaller", "PyInstaller.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# adb-shell (the TV's app list over network debugging on the phone) ships no type information.
module = ["adb_shell", "adb_shell.*"]
ignore_missing_imports = true

[tool.ruff]
# Python sources only: recent ruff releases also format Markdown and TOML by default.
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "packaging/**/*.py"]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
