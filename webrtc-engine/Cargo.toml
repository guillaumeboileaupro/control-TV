[package]
name = "control-tv-webrtc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bounded WebRTC streaming engine for control-TV"

[dependencies]
async-trait = "0.1"
bytes = "1"
rand = "0.9"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webrtc = "0.14"

[target.'cfg(target_os = "linux")'.dependencies]
# PR_SET_PDEATHSIG: a capture/encoder child must not outlive a killed host (D4-4).
libc = "0.2"

[dev-dependencies]
rtp = "0.14"
webrtc-media = "0.11"

[patch.crates-io]
# Keep standalone engine builds on the same panic-safe digest source as the Tauri workspace.
digest = { path = "../vendor/digest-0.10.7" }


